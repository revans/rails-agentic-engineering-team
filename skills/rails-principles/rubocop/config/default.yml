# RuboCop cops for the rails-principles skill (../../SKILL.md). An app inherits this one file:
#
#   # .rubocop.yml
#   inherit_from:
#     - ./skills/rails-principles/rubocop/config/default.yml
#
# `bin/rails-team-setup-project` adds that line (the installer's `rubocop` step); do not edit this file in an
# app, override a cop in the app's own .rubocop.yml instead (anything there wins over what is inherited).
#
# Every cop here is something a reviewer tends to miss that a machine can check without guessing. Judgment calls
# (KISS, naming quality, when to extract) stay in the skill for the reviewers.
require:
  - ../lib/rubocop-rails-principles

# Rails 8 strong parameters: `params.expect(user: [...])`, not `params.require(:user).permit(...)`. The cop is
# rubocop-rails's own (2.29+) and ships disabled; this turns it on. Its autocorrect is unsafe for nested
# collections (`expect` needs `[[...]]` for an array of hashes), so review what `rubocop -A` changes.
plugins:
  - rubocop-rails

Rails/StrongParametersExpect:
  Enabled: true

RailsPrinciples/ControllerActions:
  Description: Controllers expose only the seven REST actions; anything else is its own nested resource controller.
  Enabled: true
  VersionAdded: '0.1'
  Include:
    - '**/app/controllers/**/*.rb'
  AllowedActions:
    - index
    - show
    - new
    - create
    - edit
    - update
    - destroy

RailsPrinciples/FindThroughAssociation:
  Description: Look records up by id through the association that owns them, not straight off the model with params.
  Enabled: true
  VersionAdded: '0.1'
  # `find_by(<key>: params[...])` is flagged for these keys. Lookups by email, token or slug are not (nothing owns them).
  Keys:
    - id
  Include:
    - '**/app/controllers/**/*.rb'

RailsPrinciples/NoServiceObjects:
  Description: Business logic lives in models and concerns, not in service objects, decorators, presenters or form objects.
  Enabled: true
  VersionAdded: '0.1'
  # A class or module whose name ends in one of these is a service object by another name.
  ForbiddenSuffixes:
    - Service
    - Interactor
    - UseCase
    - Decorator
    - Presenter
    - FormObject
    - Form
    - Serializer
  # Whole directories that only exist to hold them.
  ForbiddenDirectories:
    - app/services
    - app/interactors
    - app/use_cases
    - app/decorators
    - app/presenters
    - app/forms
    - app/serializers
  # A plain class or module with one of these as its entry point is the service-object shape, whatever it is called.
  EntryPointMethods:
    - call
    - perform
    - execute
    - run
  # Where the entry-point check applies. Jobs, mailers and controllers have entry points by design.
  Include:
    - '**/app/**/*.rb'
    - '**/lib/**/*.rb'
  Exclude:
    - '**/app/jobs/**/*'
    - '**/app/mailers/**/*'
    - '**/app/controllers/**/*'
    - '**/app/channels/**/*'
    - '**/app/helpers/**/*'
    - '**/app/views/**/*'

RailsPrinciples/ForbiddenGems:
  Description: Dependencies the rails-principles skill rules out, with what to use instead.
  Enabled: true
  VersionAdded: '0.1'
  Include:
    - '**/Gemfile'
    - '**/gems.rb'
  # name: what to use instead. A project can add entries, or list a name under Allowed to take it off.
  Forbidden:
    redis: Use the Solid stack (Solid Queue, Solid Cache, Solid Cable).
    devise: Use the Rails 8 authentication generator (`rails generate authentication`).
    rspec: Use Minitest with fixtures.
    rspec-rails: Use Minitest with fixtures.
    factory_bot: Use fixtures.
    factory_bot_rails: Use fixtures.
    sidekiq: Use Solid Queue.
    resque: Use Solid Queue.
    good_job: Use Solid Queue.
    carrierwave: Use Active Storage.
    shrine: Use Active Storage.
    draper: Use a helper for view logic or a concern for model logic.
    active_model_serializers: Use jbuilder.
    jsonapi-serializer: Use jbuilder.
    blueprinter: Use jbuilder.
    pg_search: Use the database's native search (tsvector / pg_trgm) in a model scope.
    searchkick: Use the database's native search in a model scope.
    elasticsearch-model: Use the database's native search in a model scope.
    elasticsearch-rails: Use the database's native search in a model scope.
    thinking-sphinx: Use the database's native search in a model scope.
  Allowed: []
